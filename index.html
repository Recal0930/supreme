<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开启观影之旅（永久版）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        .verify-container {
            background-color: rgba(45, 45, 45, 0.95);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            text-align: center;
            width: 100%;
            max-width: 400px;
            border: 2px solid #00aaff;
            position: relative;
            z-index: 10;
        }
        .movie-container {
            width: 100vw;
            height: 100vh;
            display: none;
            position: relative;
            z-index: 20;
        }
        #movieIframe {
            width: 100%;
            height: 100%;
            border: none;
            sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-navigation-to=https://www.ppnix.com";
        }
        .title-suffix {
            color: #00aaff;
            font-size: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .main-title {
            color: #ffffff;
            margin-bottom: 15px;
            font-size: 36px;
            text-shadow: 0 0 10px rgba(0, 170, 255, 0.5);
        }
        .expire-tip {
            color: #ff4444;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #00aaff;
            color: #ffffff;
        }
        .btn:hover {
            background-color: #0088cc;
            transform: scale(1.02);
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: auto;
            padding: 10px 20px;
            background-color: #6c757d;
            z-index: 9999;
            display: none;
        }
        .back-btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="verify-container">
        <div class="title-suffix">（永久版）</div>
        <h1 class="main-title">开启观影之旅</h1>
        <div class="expire-tip">（永久畅享全球影视剧）</div>
        <button class="btn enter-btn">进入</button>
    </div>

    <div class="movie-container">
        <iframe id="movieIframe" src="https://www.ppnix.com/cn/"></iframe>
        <button class="btn back-btn">返回首页</button>
    </div>

    <script>
        const TARGET_URL = "https://www.ppnix.com/cn/";
        const TARGET_DOMAIN = "https://www.ppnix.com";

        const [verifyContainer, movieContainer, movieIframe, enterBtn, backBtn] = [
            document.querySelector('.verify-container'),
            document.querySelector('.movie-container'),
            document.getElementById('movieIframe'),
            document.querySelector('.enter-btn'),
            document.querySelector('.back-btn')
        ];

        enterBtn.addEventListener('click', () => {
            verifyContainer.style.display = "none";
            movieContainer.style.display = "block";
            backBtn.style.display = "block";
            movieIframe.src = TARGET_URL;
            injectInterceptScript();
        });

        backBtn.addEventListener('click', () => {
            movieContainer.style.display = "none";
            backBtn.style.display = "none";
            verifyContainer.style.display = "block";
            movieIframe.src = "";
        });

        function injectInterceptScript() {
            if (!movieIframe.contentWindow) return;

            try {
                const interceptScript = `
                    Object.defineProperty(window.top, 'location', {
                        set: function(url) {
                            if (url.startsWith('${TARGET_DOMAIN}')) {
                                window.location.href = url;
                            }
                        },
                        get: function() {
                            return window.location;
                        }
                    });

                    const originalLocationHref = Object.getOwnPropertyDescriptor(window.location, 'href');
                    Object.defineProperty(window.location, 'href', {
                        set: function(url) {
                            if (url.startsWith('${TARGET_DOMAIN}') || url.startsWith('javascript:')) {
                                originalLocationHref.set.call(this, url);
                            }
                        },
                        get: function() {
                            return originalLocationHref.get.call(this);
                        }
                    });

                    window.open = function(url) {
                        if (url && url.startsWith('${TARGET_DOMAIN}')) {
                            window.location.href = url;
                        }
                        return null;
                    };

                    Object.defineProperty(document, 'location', {
                        set: function(url) {
                            if (url.startsWith('${TARGET_DOMAIN}')) {
                                window.location.href = url;
                            }
                        }
                    });
                `;

                const script = movieIframe.contentDocument.createElement('script');
                script.textContent = interceptScript;
                movieIframe.contentDocument.head.appendChild(script);
            } catch (err) {
                movieIframe.addEventListener('load', handleIframeLoad);
            }
        }

        function handleIframeLoad() {
            try {
                const iframeDoc = movieIframe.contentDocument || movieIframe.contentWindow.document;
                const allLinks = iframeDoc.querySelectorAll('a');
                allLinks.forEach(link => {
                    link.removeAttribute('target');
                    link.addEventListener('click', e => {
                        const href = link.getAttribute('href');
                        if (href && !href.startsWith(TARGET_DOMAIN) && !href.startsWith('javascript:')) {
                            e.preventDefault();
                        }
                    });
                });
            } catch (err) {}
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('selectstart', e => e.preventDefault());
        document.addEventListener('copy', e => e.preventDefault());
        movieIframe.addEventListener('load', () => {
            try {
                const iframeDoc = movieIframe.contentDocument || movieIframe.contentWindow.document;
                iframeDoc.addEventListener('contextmenu', e => e.preventDefault());
                iframeDoc.addEventListener('selectstart', e => e.preventDefault());
            } catch (err) {}
        });
    </script>
</body>
</html>
